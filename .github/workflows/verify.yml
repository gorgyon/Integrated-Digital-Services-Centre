name: Verify IDSC skeleton
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - run: bun run check:env
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: idsc-production-skeleton
          path: .output/
          include-hidden-files: true
          retention-days: 7